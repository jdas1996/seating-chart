<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Find Your Table — The Yesudasans</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%23b8965a' stroke-width='3'/></svg>">
<style>
  :root{ --cream:#faf6ef; --line:#e5ddcd; --ink:#3d3830; --ink-soft:#8a8272; --gold:#b8965a; }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--cream);
    color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 60px;
  }
  .head{ text-align:center; margin-bottom:22px; }
  .head h1{ font-weight:400; font-size:26px; margin:0 0 4px; letter-spacing:.5px; }
  .head .date{ font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:2px; }
  .head .sub{ font-size:15px; color:var(--ink-soft); margin-top:14px; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:22px; width:100%; max-width:480px; box-shadow:0 6px 30px rgba(0,0,0,.06);
  }
  #q{
    width:100%; font:inherit; font-size:17px; padding:13px 16px;
    border:1.5px solid var(--line); border-radius:12px; background:var(--cream);
  }
  #q:focus{ outline:none; border-color:var(--gold); }
  #matches{ margin-top:8px; }
  .match{
    padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; font-size:16px;
    border-radius:8px;
  }
  .match:hover{ background:var(--cream); }
  #result{ display:none; text-align:center; }
  .table-big{
    font-size:15px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:2px; margin-top:6px;
  }
  .table-num{
    font-size:74px; line-height:1.1; color:var(--gold); font-weight:700; margin:2px 0 2px;
  }
  .guest-name{ font-size:19px; margin-bottom:2px; }
  .mates-head{
    font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1.5px;
    margin:18px 0 8px; border-top:1px solid var(--line); padding-top:14px;
  }
  #mates{ font-size:15px; line-height:1.8; }
  #mates b{ color:var(--gold); }
  #diets{ font-size:13px; color:#8a5c2e; background:#fdf3e4; border:1px solid #e8d5b5;
    border-radius:10px; padding:8px 12px; margin-top:14px; display:none; line-height:1.5; }
  .map-wrap{ margin-top:18px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
  #fp-svg{ display:block; width:100%; height:auto; }
  .btns{ display:flex; gap:10px; margin-top:18px; justify-content:center; }
  button{
    font:inherit; font-size:15px; padding:11px 22px; border-radius:12px; cursor:pointer;
    border:1.5px solid var(--gold);
  }
  #share{ background:var(--gold); color:#fff; }
  #back, #copy{ background:#fff; color:var(--gold); }
  #status{ font-size:12px; color:var(--ink-soft); margin-top:10px; min-height:16px; }
  .loading{ color:var(--ink-soft); font-size:14px; text-align:center; padding:20px 0; }

  /* floor plan styles (subset of the planner's) */
  .fp-roomfill{ fill:#fdfcf9; } .fp-foyerfill{ fill:#f7f5ef; }
  .fp-wall{ fill:none; stroke:#2a2722; stroke-width:2.2; stroke-linejoin:round; }
  .fp-wall-thin{ fill:none; stroke:#6a6459; stroke-width:1; }
  .fp-divider{ stroke:#b3ada1; stroke-width:1; stroke-dasharray:6 4; }
  .fp-door-leaf{ fill:none; stroke:#2a2722; stroke-width:1.6; }
  .fp-door-arc{ fill:none; stroke:#6a6459; stroke-width:.9; }
  .fp-lbl,.fp-lbl-sm{ font:600 7px sans-serif; fill:#5a554c; text-anchor:middle; dominant-baseline:middle; }
  .fp-zone{ font:700 11px sans-serif; fill:#a49c8c; text-anchor:middle; letter-spacing:.06em; }
  .fp-furn{ fill:#efece4; stroke:#7d7669; stroke-width:1.3; }
  .fp-fixed{ fill:#e2ded4; stroke:#8b8478; }
  .fp-cock{ fill:#f4f1e8; stroke:#8a8375; stroke-width:1.2; }
  .fp-tbl{ fill:#e8f1ef; stroke:#2f6f6b; stroke-width:1.4; }
  .fp-num{ font:700 11px sans-serif; fill:#1d4a47; text-anchor:middle; dominant-baseline:middle; }
  .fp-seats,.fp-title,.fp-badge,.fp-badge-t{ display:none; }
  .fp-hitarea{ fill:transparent; }
  .gp-dim{ fill:#3d3830; fill-opacity:.55; }
  .gp-target .fp-tbl{ fill:#fdf3d0; stroke:var(--gold); stroke-width:3; }
  .gp-target .fp-num{ font-size:15px; fill:#8a6d3b; }
  .gp-ring{ fill:none; stroke:var(--gold); stroke-width:2.5; stroke-dasharray:5 4; }
</style>
</head>
<body>

<div class="head">
  <h1>The Yesudasans</h1>
  <div class="date">Reception · August 22, 2026</div>
  <div class="sub">Find your table</div>
</div>

<div class="card">
  <div id="searcher">
    <input type="text" id="q" placeholder="Type your name…" autocomplete="off" autofocus>
    <div id="matches"></div>
    <div class="loading" id="loading">Loading the seating chart…</div>
  </div>

  <div id="result">
    <div class="guest-name" id="r-name"></div>
    <div class="table-big" id="r-label">You're at table</div>
    <div class="table-num" id="r-num"></div>
    <div class="mates-head">You're sitting with</div>
    <div id="mates"></div>
    <div id="diets"></div>
    <div class="map-wrap"><svg id="fp-svg" viewBox="8 300 1090 372"></svg></div>
    <div class="btns">
      <button id="share">Share</button>
      <button id="copy">Copy as text</button>
      <button id="back">← Search again</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="floorplan.js"></script>
<script src="guest.js"></script>
</body>
</html>
